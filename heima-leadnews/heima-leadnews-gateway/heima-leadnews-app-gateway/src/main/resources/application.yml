server:
  port: 51601
spring:
  profiles:
    include: gateway
  application:
    name: leadnews-app-gateway
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848

jwt:
  secret: ${JWT_SECRET}

# 可观测性：指标监控（/actuator/prometheus 供 Prometheus 抓取）+ 分布式链路追踪（Zipkin）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0        # 本地全量采样；生产建议 0.1~0.5
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

