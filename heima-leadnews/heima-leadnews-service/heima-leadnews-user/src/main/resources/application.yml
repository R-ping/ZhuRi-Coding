server:
  port: 51780
spring:
  application:
    name: leadnews-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/leadnews_user?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  data:
    redis:
      port: 6379
      host: localhost
  # FreeMarker 模板引擎配置
#  freemarker:
#    charset: UTF-8
#    suffix: .ftl
#    content-type: text/html
#    template-loader-path: classpath:/templates/
# 设置Mapper接口所对应的XML文件位置，如果你在Mapper接口中有自定义方法，需要进行该配置
mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
  mapper-locations: classpath*:mapper/*.xml
  # 设置别名包扫描路径，通过该属性可以给包中的类注册别名
  type-aliases-package: com.heima.model.user.pojos
# 日志
logging:
  level:
    com.heima: debug

# 第三方登录 OAuth 配置（通过环境变量注入，禁止硬编码敏感信息）
oauth:
  weibo:
    client-id: ${OAUTH_WEIBO_CLIENT_ID}
    redirect-http: ${CPOlAR_BASE_URL:}
    redirect-uri: ${CPOlAR_BASE_URI:/oauth/callback}
    authorize-url: https://api.weibo.com/oauth2/authorize
  github:
    client-id: ${OAUTH_GITHUB_CLIENT_ID}
    redirect-http: ${CPOlAR_BASE_URL:https://8d58228.r40.cpolar.top}
    redirect-uri: ${CPOlAR_BASE_URI:/oauth/callback}
    authorize-url: https://github.com/login/oauth/authorize
  wechat:
    # 公众号二维码图片URL（通过环境变量配置）
    qrcode-url: ${OAUTH_WECHAT_QRCODE_URL:mmexport1780758632985.jpeg}

aliyun:
  oss:
    accessKeyId: ${ALIBABA_RAM_ACCESS_KEY}
    accessKeySecret: ${ALIBABA_RAM_ACCESS_SECRET}
    endpoint: http://oss-cn-beijing.aliyuncs.com
    host: https://zhuri-leadnews.oss-cn-beijing.aliyuncs.com
    bucket: zhuri-leadnews
    dir: material/
    expireTime: 300

# 可观测性：指标监控（/actuator/prometheus 供 Prometheus 抓取）+ 分布式链路追踪（Zipkin）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0        # 本地全量采样；生产建议 0.1~0.5
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans