server:
  port: 51780
spring:
  application:
    name: zhuri-coding-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/leadnews_user?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
    # Feign 熔断降级开关：必须显式打开（默认值为 false），否则 @FeignClient 的 fallback 被静默忽略
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    redis:
      port: 6379
      host: localhost
  # FreeMarker 模板引擎配置
#  freemarker:
#    charset: UTF-8
#    suffix: .ftl
#    content-type: text/html
#    template-loader-path: classpath:/templates/
# 设置Mapper接口所对应的XML文件位置，如果你在Mapper接口中有自定义方法，需要进行该配置
mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
  mapper-locations: classpath*:mapper/*.xml
  # 设置别名包扫描路径，通过该属性可以给包中的类注册别名
  type-aliases-package: com.zhuri.coding.model.user.pojos
# 日志
logging:
  level:
    com.zhuri.coding: debug

# 第三方登录 OAuth 配置（通过环境变量注入，禁止硬编码敏感信息）
oauth:
  weibo:
    client-id: ${OAUTH_WEIBO_CLIENT_ID}
    redirect-http: ${CPOlAR_BASE_URL:}
    redirect-uri: ${CPOlAR_BASE_URI:/oauth/callback}
    authorize-url: https://api.weibo.com/oauth2/authorize
  github:
    client-id: ${OAUTH_GITHUB_CLIENT_ID}
    redirect-http: ${CPOlAR_BASE_URL:https://8d58228.r40.cpolar.top}
    redirect-uri: ${CPOlAR_BASE_URI:/oauth/callback}
    authorize-url: https://github.com/login/oauth/authorize
  wechat:
    # 公众号二维码图片URL（通过环境变量配置）
    qrcode-url: ${OAUTH_WECHAT_QRCODE_URL:mmexport1780758632985.jpeg}

aliyun:
  oss:
    accessKeyId: ${ALIBABA_RAM_ACCESS_KEY}
    accessKeySecret: ${ALIBABA_RAM_ACCESS_SECRET}
    endpoint: http://oss-cn-beijing.aliyuncs.com
    host: https://zhuri-leadnews.oss-cn-beijing.aliyuncs.com
    bucket: zhuri-leadnews
    dir: material/
    expireTime: 300

# 可观测性：指标监控（/actuator/prometheus 供 Prometheus 抓取）+ 分布式链路追踪（Zipkin）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0        # 本地全量采样；生产建议 0.1~0.5
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
# 微信公众号（公众号后台"服务器配置"里的 Token；未配置则回调一律拒绝，fail-closed）
# 原 Token 保留为兜底默认值（huhudong），生产环境务必通过 WECHAT_GZH_TOKEN 环境变量覆盖。
wechat:
  gzh:
    token: ${WECHAT_GZH_TOKEN:huhudong}

# 网关-下游内部身份签名密钥（HMAC，网关与各服务必须一致；生产务必用 INTERNAL_AUTH_SECRET 环境变量覆盖）
app:
  internal-auth:
    secret: ${INTERNAL_AUTH_SECRET:zhuri-coding-internal-dev-secret}
  auth:
    # 是否在响应体中回传登录验证码：仅为本地/演示环境缺少真实短信通道时的联调便利。
    # 生产环境必须设为 false（AUTH_EXPOSE_LOGIN_CODE=false），否则无需收短信即可登录/绑定他人手机号。
    expose-login-code: ${AUTH_EXPOSE_LOGIN_CODE:true}
